name: Main PR Source

on:
  pull_request:
    branches:
      - main

jobs:
  require-dev-source:
    # Self-hosted ARC runners never run pull requests from other forks (this repository is public).
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Default: the ephemeral ARC runner arc-ego-lite; EGO_LITE_RUNS_ON (JSON) temporarily overrides it.
    runs-on: ${{ fromJSON(vars.EGO_LITE_RUNS_ON || '"arc-ego-lite"') }}
    steps:
      - name: Require dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Pull requests into main must come from the dev branch."
            exit 1
          fi
