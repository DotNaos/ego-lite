name: Main PR Source

on:
  pull_request:
    branches:
      - main

jobs:
  require-dev-source:
    if: github.repository == 'citrolabs/ego-lite'
    runs-on: ${{ fromJSON(vars.EGO_LITE_RUNS_ON || '["arc-ego-lite"]') }}
    steps:
      - name: Require dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Pull requests into main must come from the dev branch."
            exit 1
          fi
